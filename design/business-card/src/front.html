<!-- FRONT — sage, logo left, name top, email in Lora, QR on cream panel -->
<div class="card card-front{{GUIDECLASS}}">
  <div class="safe">
    <div class="front-grid">
      <div class="logo-col">
        <img src="{{LOGO_CREAM}}" alt="The Potter Sanctuary" />
      </div>
      <div class="text-col">
        <div class="brand-name"><span class="the">The</span>Potter Sanctuary</div>
        <div class="rule"></div>
        <div class="tagline">Massage &amp; Wellbeing</div>
        <div class="email">hello@thepottersanctuary.co.uk</div>
      </div>
      <div class="qr-col">
        <div class="qr-panel"><img src="{{QR}}" alt="thepottersanctuary.co.uk" /></div>
      </div>
    </div>
  </div>
  {{GUIDES}}
</div>
