name: CI

# Runs the existing quality gate automatically on every push (any branch) and
# every pull request. Any failing step fails the check, so a broken build can't
# be merged unnoticed. Infrastructure only — this does not change app behaviour.
#
# Gate = type-check -> tests -> build (the project's working gate; see CLAUDE.md).
# `npm run lint` is intentionally NOT included yet: the repo has no ESLint config,
# so `next lint` prompts interactively and fails in CI. Add lint here once an
# ESLint config exists.
#
# No secrets/env vars are required: `next build` completes with all app env unset
# (supabaseAdmin is created conditionally and requireEnv only runs in request
# handlers, never at build time).

on:
  push:
  pull_request:

# Least privilege — CI only needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref so pushes don't pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Quality gate (type-check · test · build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
